<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Chunker - Spezzetta Video per Gemini</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: #f8f9ff;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-area:hover {
            background: #f0f2ff;
            border-color: #764ba2;
        }

        .upload-area.dragover {
            background: #e8ebff;
            border-color: #764ba2;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .upload-text {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #999;
            font-size: 14px;
        }

        input[type="file"] {
            display: none;
        }

        .progress-container {
            display: none;
            margin-top: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #f0f0f0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            font-size: 14px;
        }

        .progress-text {
            color: #666;
            font-size: 14px;
            text-align: center;
        }

        .results {
            display: none;
            margin-top: 30px;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        .chunks-list {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .chunks-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .chunk-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: white;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .chunk-name {
            color: #333;
            font-size: 14px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .download-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.2s ease;
            margin-left: 10px;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .download-all-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            margin-top: 20px;
            transition: transform 0.2s ease;
        }

        .download-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .reset-btn {
            width: 100%;
            background: #6c757d;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            margin-top: 10px;
            transition: background 0.2s ease;
        }

        .reset-btn:hover {
            background: #5a6268;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid #f5c6cb;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 Video Chunker</h1>
        <p class="subtitle">Spezzetta video in blocchi da meno di 200 MB per Gemini</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📹</div>
            <div class="upload-text">Clicca o trascina qui il tuo video</div>
            <div class="upload-hint">Qualsiasi formato, qualsiasi dimensione</div>
            <input type="file" id="fileInput" accept="video/*">
        </div>

        <div class="progress-container" id="progressContainer">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill">0%</div>
            </div>
            <div class="progress-text" id="progressText">Caricamento in corso...</div>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="results" id="results">
            <div class="success-message">
                ✅ Video spezzettato con successo!
            </div>
            <div class="chunks-list">
                <div class="chunks-title">Chunks generati:</div>
                <div id="chunksList"></div>
                <button class="download-all-btn" id="downloadAllBtn">
                    📥 Scarica tutti i chunks
                </button>
            </div>
            <button class="reset-btn" id="resetBtn">Carica un altro video</button>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const results = document.getElementById('results');
        const chunksList = document.getElementById('chunksList');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const resetBtn = document.getElementById('resetBtn');
        const errorMessage = document.getElementById('errorMessage');

        let currentSessionId = null;

        // Click per aprire il file selector
        uploadArea.addEventListener('click', () => {
            fileInput.click();
        });

        // Drag & drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // File input change
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // Gestione del file
        async function handleFile(file) {
            // Verifica che sia un video
            if (!file.type.startsWith('video/')) {
                showError('Per favore seleziona un file video valido');
                return;
            }

            // Nascondi errori precedenti
            errorMessage.style.display = 'none';

            // Mostra progress
            uploadArea.style.display = 'none';
            progressContainer.style.display = 'block';
            results.style.display = 'none';

            // Crea FormData
            const formData = new FormData();
            formData.append('video', file);

            try {
                // Upload con progress
                const xhr = new XMLHttpRequest();

                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        progressFill.style.width = percent + '%';
                        progressFill.textContent = percent + '%';
                        progressText.textContent = 'Caricamento: ' + percent + '%';
                    }
                });

                xhr.addEventListener('load', () => {
                    if (xhr.status === 200) {
                        const response = JSON.parse(xhr.responseText);
                        progressText.textContent = 'Spezzettamento in corso...';
                        handleSuccess(response);
                    } else {
                        const error = JSON.parse(xhr.responseText);
                        showError(error.error || 'Errore durante il caricamento');
                    }
                });

                xhr.addEventListener('error', () => {
                    showError('Errore di rete durante il caricamento');
                });

                xhr.open('POST', '/upload');
                xhr.send(formData);

            } catch (error) {
                showError('Errore: ' + error.message);
            }
        }

        // Gestione successo
        function handleSuccess(response) {
            currentSessionId = response.sessionId;

            // Mostra risultati
            progressContainer.style.display = 'none';
            results.style.display = 'block';

            // Popola la lista dei chunks
            chunksList.innerHTML = '';
            response.chunks.forEach((chunk, index) => {
                const chunkItem = document.createElement('div');
                chunkItem.className = 'chunk-item';
                chunkItem.innerHTML = `
                    <span class="chunk-name">${chunk}</span>
                    <button class="download-btn" onclick="downloadChunk('${chunk}')">
                        Scarica
                    </button>
                `;
                chunksList.appendChild(chunkItem);
            });
        }

        // Download singolo chunk
        function downloadChunk(filename) {
            const url = `/output/session-${currentSessionId}/${filename}`;
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
        }

        // Download tutti i chunks
        downloadAllBtn.addEventListener('click', async () => {
            const response = await fetch(`/download-all/${currentSessionId}`);
            const data = await response.json();

            data.files.forEach(filename => {
                setTimeout(() => {
                    downloadChunk(filename);
                }, 100 * data.files.indexOf(filename));
            });
        });

        // Reset
        resetBtn.addEventListener('click', () => {
            uploadArea.style.display = 'block';
            progressContainer.style.display = 'none';
            results.style.display = 'none';
            errorMessage.style.display = 'none';
            fileInput.value = '';
            progressFill.style.width = '0%';
            progressFill.textContent = '0%';
            currentSessionId = null;
        });

        // Mostra errore
        function showError(message) {
            errorMessage.textContent = '❌ ' + message;
            errorMessage.style.display = 'block';
            progressContainer.style.display = 'none';
            uploadArea.style.display = 'block';
        }
    </script>
</body>
</html>
